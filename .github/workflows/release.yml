name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_VERSION: "1.94.0"

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  package-linux:
    name: Linux portable and AppImage
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            fuse libfuse2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Package Linux portable tarball
        run: ./packaging/linux/package-portable.sh

      - name: Package Linux AppImage
        run: ./packaging/linux/package-appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: |
            dist/Ottrin-*-linux-x86_64-portable.tar.gz
            dist/Ottrin-*-linux-x86_64-portable.tar.gz.sha256
            dist/Ottrin-*-x86_64.AppImage
            dist/Ottrin-*-x86_64.AppImage.sha256
          if-no-files-found: error

  package-windows-portable:
    name: Windows portable zip
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full zip

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Package Windows portable zip
        run: ./packaging/windows/package-portable.sh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-artifacts
          path: |
            dist/Ottrin-*-windows-x64-portable.zip
            dist/Ottrin-*-windows-x64-portable.zip.sha256
          if-no-files-found: error

  package-windows-installer:
    name: Windows installer
    needs: package-windows-portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-artifacts
          path: dist

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Package Windows installer
        shell: powershell
        run: |
          $archives = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows portable archive for installer packaging." }
          $archive = $archives[0]
          $checksumFiles = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip.sha256 -File)
          if ($checksumFiles.Count -ne 1) { throw "Expected exactly one Windows portable checksum for installer packaging." }
          $expectedHash = ((Get-Content $checksumFiles[0].FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw "Windows portable archive checksum does not match its sidecar." }
          Expand-Archive -Path $archive.FullName -DestinationPath dist\installer-payload
          $stages = @(Get-ChildItem dist\installer-payload -Directory)
          if ($stages.Count -ne 1) { throw "Expected exactly one extracted Windows portable stage for installer packaging." }
          $stage = $stages[0]
          .\packaging\windows\package-installer.ps1 -Stage $stage.FullName

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-artifacts
          path: |
            dist/Ottrin-*-windows-x64-setup.exe
            dist/Ottrin-*-windows-x64-setup.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [package-linux, package-windows-portable, package-windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install release artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Verify release checksums
        shell: bash
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Verify portable artifact contents
        shell: bash
        run: ./packaging/verify-release-artifacts.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
