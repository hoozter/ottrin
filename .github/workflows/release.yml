name: release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to retry
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: "1.94.0"

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Verify tag matches package version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev desktop-file-utils \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            bubblewrap dbus-user-session apparmor-profiles python3-pil

      - name: Prepare Linux process isolation
        if: runner.os == 'Linux'
        run: ./scripts/ci/prepare-linux-isolation.sh

      - name: Prepare pinned search provider
        shell: bash
        run: bash scripts/ci/prepare-search-runtime.sh

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --workspace --all-targets

      - name: Prepare production Linux HTML sandbox
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_JOBS: 2
        run: python3 scripts/ci/linux-html-sandbox.py prepare

      - name: Verify production HTML pixels and executable mapping policy
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 scripts/ci/test_linux_html_transition.py
          /usr/bin/python3 scripts/ci/verify-linux-html-sandbox.py

      - name: Check Windows Move ownership before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: >-
          cargo test -p ottrin-platform --
          windows_native_move_private_directory_admits_its_owned_policy_and_refuses_replaced_parent
          windows_native_move_cleanup
          windows_native_replace_undo_admits_current_parents_without_rebinding_foreign_names
          --nocapture

      - name: Check Windows Office contracts before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p ottrin-preview --test office_provider_contract -- --nocapture

      - name: Check Windows native preview boundary before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo test -p ottrin-preview --test windows_job_native -- --nocapture 2>&1 | Tee-Object -FilePath windows-job-fixtures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Windows Move UI recovery before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p ottrin-ui --lib windows_move_ -- --nocapture

      - name: Check Windows index transport before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p ottrin-search --lib windows_pipe_ -- --nocapture

      - name: Test workspace
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Upload Windows native boundary failure diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-boundary-failure
          path: windows-job-fixtures.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Retire production Linux HTML integration
        if: always() && runner.os == 'Linux'
        run: python3 scripts/ci/linux-html-sandbox.py cleanup

      - name: Retire pinned search provider
        if: always()
        shell: bash
        run: bash scripts/ci/prepare-search-runtime.sh cleanup

      - name: Upload Linux HTML sandbox evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-html-sandbox
          path: html-sandbox-evidence/
          if-no-files-found: ignore
          retention-days: 7

  package-linux:
    name: Linux portable, AppImage, DEB and RPM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev desktop-file-utils \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            appstream fuse libfuse2 rpm cpio binutils

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Package Linux portable tarball
        run: ./packaging/linux/package-portable.sh

      - name: Package Linux AppImage
        run: ./packaging/linux/package-appimage.sh

      - name: Import Linux release signing key
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ottrin-gnupg"
          export GNUPGHOME="$RUNNER_TEMP/ottrin-gnupg"
          printf 'GNUPGHOME=%s\n' "$RUNNER_TEMP/ottrin-gnupg" >> "$GITHUB_ENV"
          printf '%s' "$LINUX_SIGNING_PRIVATE_KEY" | ./packaging/linux/import-release-signing-subkey.sh

      - name: Package native Linux formats
        env:
          OTTRIN_SKIP_BUILD: 1
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
          OTTRIN_LINUX_REPOSITORY_URL: ${{ vars.LINUX_REPOSITORY_URL }}
        run: |
          if [[ -n "$OTTRIN_LINUX_REPOSITORY_URL" ]]; then
            export OTTRIN_LINUX_REPOSITORY_KEY="$RUNNER_TEMP/ottrin-repository-key.asc"
            gpg --batch --armor --export "$OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT" > "$OTTRIN_LINUX_REPOSITORY_KEY"
          fi
          ./packaging/linux/package-deb.sh
          ./packaging/linux/package-rpm.sh

      - name: Sign Linux release artifacts
        env:
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          ./packaging/linux/sign-rpm-packages.sh dist/ottrin-*.x86_64.rpm
          (
            cd dist
            for package in ottrin-*.x86_64.rpm; do
              sha256sum "$package" > "$package.sha256"
            done
          )
          ./packaging/linux/sign-release-artifacts.sh \
            dist/Ottrin-*-linux-x86_64-portable.tar.gz \
            dist/Ottrin-*-x86_64.AppImage \
            dist/ottrin_*_amd64.deb \
            dist/ottrin-*.x86_64.rpm
          gpg --batch --armor --export "$OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT" \
            > dist/Ottrin-linux-release-key.asc

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release-artifacts
          path: |
            dist/Ottrin-*-linux-x86_64-portable.tar.gz
            dist/Ottrin-*-linux-x86_64-portable.tar.gz.sha256
            dist/Ottrin-*-x86_64.AppImage
            dist/Ottrin-*-x86_64.AppImage.sha256
            dist/ottrin_*_amd64.deb
            dist/ottrin_*_amd64.deb.sha256
            dist/ottrin-*.x86_64.rpm
            dist/ottrin-*.x86_64.rpm.sha256
            dist/*.asc
          if-no-files-found: error

      - name: Retire Linux signing keyring
        if: always()
        run: |
          keyring="$RUNNER_TEMP/ottrin-gnupg"
          if [[ -d "$keyring" ]]; then
            GNUPGHOME="$keyring" gpgconf --kill all
            rm -rf -- "$keyring"
          fi

  package-windows-portable:
    name: Windows portable zip
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full zip

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Package Windows portable zip
        run: ./packaging/windows/package-portable.sh

      - name: Upload unsigned Windows stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unsigned-stage
          path: |
            dist/Ottrin-*-windows-x64-portable.zip
            dist/Ottrin-*-windows-x64-portable.zip.sha256
          if-no-files-found: error

  package-windows-installer:
    name: Windows installer
    needs: package-windows-portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-unsigned-stage
          path: dist

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          dotnet tool install --global wix --version 5.*

      - name: Package unsigned Windows installers
        shell: powershell
        run: |
          $archives = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows portable archive for installer packaging." }
          $archive = $archives[0]
          $checksumFiles = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip.sha256 -File)
          if ($checksumFiles.Count -ne 1) { throw "Expected exactly one Windows portable checksum for installer packaging." }
          $expectedHash = ((Get-Content $checksumFiles[0].FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw "Windows portable archive checksum does not match its sidecar." }
          Expand-Archive -Path $archive.FullName -DestinationPath dist\installer-payload
          $stages = @(Get-ChildItem dist\installer-payload -Directory)
          if ($stages.Count -ne 1) { throw "Expected exactly one extracted Windows portable stage for installer packaging." }
          $stage = $stages[0]
          .\packaging\windows\package-installer.ps1 -Stage $stage.FullName
          .\packaging\windows\package-msi.ps1 -Stage $stage.FullName
          $installers = @(
            Get-ChildItem dist\Ottrin-*-windows-x64-setup.exe -File
            Get-ChildItem dist\Ottrin-*-windows-x64.msi -File
          )
          if ($installers.Count -ne 2) { throw "Expected one EXE installer and one MSI installer." }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          }

      - name: Upload unsigned Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-artifacts
          path: |
            dist/Ottrin-*-windows-x64-portable.zip
            dist/Ottrin-*-windows-x64-portable.zip.sha256
            dist/Ottrin-*-windows-x64-setup.exe
            dist/Ottrin-*-windows-x64-setup.exe.sha256
            dist/Ottrin-*-windows-x64.msi
            dist/Ottrin-*-windows-x64.msi.sha256
          if-no-files-found: error

  verify-windows-artifacts:
    name: Verify downloaded unsigned Windows artifacts
    needs: package-windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-artifacts
          path: dist

      - name: Verify exact downloaded artifact checksums
        shell: powershell
        run: |
          $archives = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip -File)
          $setups = @(Get-ChildItem dist\Ottrin-*-windows-x64-setup.exe -File)
          $msis = @(Get-ChildItem dist\Ottrin-*-windows-x64.msi -File)
          if ($archives.Count -ne 1 -or $setups.Count -ne 1 -or $msis.Count -ne 1) {
            throw "Expected one downloaded portable archive, EXE installer, and MSI installer."
          }
          foreach ($file in @($archives[0], $setups[0], $msis[0])) {
            $sidecar = "$($file.FullName).sha256"
            $entries = @(Get-Content -LiteralPath $sidecar | Where-Object { $_.Trim() })
            if ($entries.Count -ne 1) { throw "Expected exactly one checksum entry for $($file.Name)." }
            $parts = $entries[0].Trim() -split '\s+', 2
            if ($parts.Count -ne 2 -or $parts[0] -notmatch '^[0-9a-fA-F]{64}$' -or $parts[1] -cne $file.Name) {
              throw "Invalid checksum sidecar for $($file.Name)."
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            if ($actual -ine $parts[0]) { throw "Downloaded checksum mismatch for $($file.Name)." }
          }

  release:
    name: Stage GitHub release draft
    needs: [package-linux, verify-windows-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install release artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full rpm cpio binutils

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-release-artifacts"
          merge-multiple: true
          path: dist/

      - name: Verify release checksums
        shell: bash
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Verify portable artifact contents
        shell: bash
        run: ./packaging/verify-release-artifacts.sh dist

      - name: Verify exact downloaded Linux signatures
        env:
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          ./packaging/linux/verify-release-signatures.sh \
            dist/Ottrin-linux-release-key.asc \
            dist/Ottrin-*-linux-x86_64-portable.tar.gz \
            dist/Ottrin-*-x86_64.AppImage \
            dist/ottrin_*_amd64.deb \
            dist/ottrin-*.x86_64.rpm

      - name: Verify exact downloaded RPM package signatures
        env:
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: ./packaging/linux/verify-rpm-signatures.sh dist/Ottrin-linux-release-key.asc dist/ottrin-*.x86_64.rpm

      - name: Refuse changes to a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name')"
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$published_tags"; then
            echo "Release $GITHUB_REF_NAME is already public. Use a new tag for new artifacts." >&2
            exit 1
          fi

      - name: Create GitHub release draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  stage-linux-repositories:
    name: Stage repositories for a published stable release
    if: >-
      vars.LINUX_REPOSITORY_STAGING_ENABLED == 'true' &&
      ((github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    concurrency:
      group: linux-stable-repositories
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install archive tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm

      - name: Verify and stage signed repositories
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          cleanup() {
            gpgconf --kill all
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup EXIT
          printf '%s' "$LINUX_SIGNING_PRIVATE_KEY" | ./packaging/linux/import-release-signing-subkey.sh
          unset LINUX_SIGNING_PRIVATE_KEY
          ./packaging/linux/prepare-release-repositories.sh "$RELEASE_TAG" "$RUNNER_TEMP/ottrin-linux-repositories"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-linux-repositories
          path: ${{ runner.temp }}/ottrin-linux-repositories
          if-no-files-found: error

      - name: Verify repository publication recovery
        run: python3 packaging/tests/verify-repository-publication.py

      - name: Publish and verify stable APT and RPM repositories
        if: vars.LINUX_REPOSITORY_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ottrin
          LINUX_REPOSITORY_PUBLIC_ORIGIN: ${{ vars.LINUX_REPOSITORY_PUBLIC_ORIGIN }}
        run: python3 packaging/linux/publish-release-repositories.py "$RUNNER_TEMP/ottrin-linux-repositories"
