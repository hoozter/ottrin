name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RUST_VERSION: "1.94.0"

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify tag matches package version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  package-linux:
    name: Linux portable and AppImage
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            fuse libfuse2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Package Linux portable tarball
        run: ./packaging/linux/package-portable.sh

      - name: Package Linux AppImage
        run: ./packaging/linux/package-appimage.sh

      - name: Import Linux release signing key
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ottrin-gnupg"
          export GNUPGHOME="$RUNNER_TEMP/ottrin-gnupg"
          printf 'GNUPGHOME=%s\n' "$RUNNER_TEMP/ottrin-gnupg" >> "$GITHUB_ENV"
          printf '%s' "$LINUX_SIGNING_PRIVATE_KEY" | gpg --batch --import

      - name: Sign Linux release artifacts
        env:
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          ./packaging/linux/sign-release-artifacts.sh \
            dist/Ottrin-*-linux-x86_64-portable.tar.gz \
            dist/Ottrin-*-x86_64.AppImage
          gpg --batch --armor --export "$OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT" \
            > dist/Ottrin-linux-release-key.asc

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release-artifacts
          path: |
            dist/Ottrin-*-linux-x86_64-portable.tar.gz
            dist/Ottrin-*-linux-x86_64-portable.tar.gz.sha256
            dist/Ottrin-*-x86_64.AppImage
            dist/Ottrin-*-x86_64.AppImage.sha256
            dist/*.asc
          if-no-files-found: error

  package-windows-portable:
    name: Windows portable zip
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full zip

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Package Windows portable zip
        run: ./packaging/windows/package-portable.sh

      - name: Upload unsigned Windows stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unsigned-stage
          path: |
            dist/Ottrin-*-windows-x64-portable.zip
            dist/Ottrin-*-windows-x64-portable.zip.sha256
          if-no-files-found: error

  package-windows-installer:
    name: Windows installer
    needs: package-windows-portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-unsigned-stage
          path: dist

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          dotnet tool install --global wix --version 5.*

      - name: Sign portable payload and package Windows installers
        shell: powershell
        env:
          OTTRIN_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          OTTRIN_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          OTTRIN_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          $archives = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows portable archive for installer packaging." }
          $archive = $archives[0]
          $checksumFiles = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip.sha256 -File)
          if ($checksumFiles.Count -ne 1) { throw "Expected exactly one Windows portable checksum for installer packaging." }
          $expectedHash = ((Get-Content $checksumFiles[0].FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw "Windows portable archive checksum does not match its sidecar." }
          Expand-Archive -Path $archive.FullName -DestinationPath dist\installer-payload
          $stages = @(Get-ChildItem dist\installer-payload -Directory)
          if ($stages.Count -ne 1) { throw "Expected exactly one extracted Windows portable stage for installer packaging." }
          $stage = $stages[0]
          .\packaging\windows\sign-release-artifacts.ps1 -Files @(
            (Join-Path $stage.FullName 'bin\ottrin.exe'),
            (Join-Path $stage.FullName 'bin\ottrin-priv-helper.exe')
          )

          Remove-Item -LiteralPath $archive.FullName, $checksumFiles[0].FullName -Force
          Compress-Archive -LiteralPath $stage.FullName -DestinationPath $archive.FullName
          $portableHash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          "$portableHash  $($archive.Name)" | Set-Content -Encoding ascii "$($archive.FullName).sha256"

          .\packaging\windows\package-installer.ps1 -Stage $stage.FullName
          .\packaging\windows\package-msi.ps1 -Stage $stage.FullName
          $installers = @(
            Get-ChildItem dist\Ottrin-*-windows-x64-setup.exe -File
            Get-ChildItem dist\Ottrin-*-windows-x64.msi -File
          )
          if ($installers.Count -ne 2) { throw "Expected one EXE installer and one MSI installer for signing." }
          .\packaging\windows\sign-release-artifacts.ps1 -Files $installers.FullName
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          }

      - name: Upload signed Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-artifacts
          path: |
            dist/Ottrin-*-windows-x64-portable.zip
            dist/Ottrin-*-windows-x64-portable.zip.sha256
            dist/Ottrin-*-windows-x64-setup.exe
            dist/Ottrin-*-windows-x64-setup.exe.sha256
            dist/Ottrin-*-windows-x64.msi
            dist/Ottrin-*-windows-x64.msi.sha256
          if-no-files-found: error

  verify-windows-signatures:
    name: Verify downloaded Windows signatures
    needs: package-windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-artifacts
          path: dist

      - name: Verify exact downloaded Authenticode signatures
        shell: powershell
        env:
          OTTRIN_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          $expectedThumbprint = ([string]$env:OTTRIN_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($expectedThumbprint -notmatch '^[0-9A-F]{40}$') { throw "The approved Windows signing certificate thumbprint is missing or invalid." }
          $archives = @(Get-ChildItem dist\Ottrin-*-windows-x64-portable.zip -File)
          $setups = @(Get-ChildItem dist\Ottrin-*-windows-x64-setup.exe -File)
          $msis = @(Get-ChildItem dist\Ottrin-*-windows-x64.msi -File)
          if ($archives.Count -ne 1 -or $setups.Count -ne 1 -or $msis.Count -ne 1) {
            throw "Expected one downloaded portable archive, EXE installer, and MSI installer."
          }
          Expand-Archive -Path $archives[0].FullName -DestinationPath dist\signature-verification
          $portableExecutables = @(Get-ChildItem dist\signature-verification\*\bin\ottrin*.exe -File)
          if ($portableExecutables.Count -ne 2) { throw "Expected two Ottrin executables in the signed portable archive." }
          foreach ($file in @($portableExecutables) + @($setups[0], $msis[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) {
              throw "Authenticode signer identity does not match the approved certificate for $($file.Name)."
            }
            & signtool.exe verify /pa /all $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($file.Name)." }
          }

  release:
    name: Publish GitHub release
    needs: [package-linux, verify-windows-signatures]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install release artifact inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-release-artifacts"
          merge-multiple: true
          path: dist/

      - name: Verify release checksums
        shell: bash
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Verify portable artifact contents
        shell: bash
        run: ./packaging/verify-release-artifacts.sh dist

      - name: Verify exact downloaded Linux signatures
        env:
          OTTRIN_LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          ./packaging/linux/verify-release-signatures.sh \
            dist/Ottrin-linux-release-key.asc \
            dist/Ottrin-*-linux-x86_64-portable.tar.gz \
            dist/Ottrin-*-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
