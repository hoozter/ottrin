name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_VERSION: "1.94.0"

jobs:
  package-linux:
    name: Linux portable and AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            fuse libfuse2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Package Linux portable tarball
        run: ./packaging/linux/package-portable.sh

      - name: Package Linux AppImage
        run: ./packaging/linux/package-appimage.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: |
            dist/Ottrin-*-linux-x86_64-portable.tar.gz
            dist/Ottrin-*-linux-x86_64-portable.tar.gz.sha256
            dist/Ottrin-*-x86_64.AppImage
            dist/Ottrin-*-x86_64.AppImage.sha256
          if-no-files-found: error

  package-windows-portable:
    name: Windows portable zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Package Windows portable zip
        run: ./packaging/windows/package-portable.sh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-artifacts
          path: |
            dist/Ottrin-*-windows-x64-portable.zip
            dist/Ottrin-*-windows-x64-portable.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [package-linux, package-windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
