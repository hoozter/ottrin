name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  RUST_VERSION: "1.94.0"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev desktop-file-utils ripgrep \
            bubblewrap dbus-user-session apparmor-profiles python3-pil

      - name: Prepare Linux process isolation
        if: runner.os == 'Linux'
        run: ./scripts/ci/prepare-linux-isolation.sh

      - name: Install Windows test dependencies
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Prepare production Linux HTML sandbox
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_JOBS: 2
        run: python3 scripts/ci/linux-html-sandbox.py prepare

      - name: Verify production HTML pixels and executable mapping policy
        if: runner.os == 'Linux'
        run: /usr/bin/python3 scripts/ci/verify-linux-html-sandbox.py

      - name: Check Windows Move ownership before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: >-
          cargo test -p ottrin-platform --
          windows_native_move_private_directory_admits_its_owned_policy_and_refuses_replaced_parent
          windows_native_move_cleanup
          windows_native_replace_undo_admits_current_parents_without_rebinding_foreign_names
          --nocapture

      - name: Check Windows Office contracts before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p ottrin-preview --test office_provider_contract -- --nocapture

      - name: Check Windows native preview boundary before workspace suite
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo test -p ottrin-preview --test windows_job_native -- --nocapture 2>&1 | Tee-Object -FilePath windows-job-fixtures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cargo test
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release -p ottrin-app -p ottrin-platform -p ottrin-search

      - name: Prepare release-build artifact
        shell: bash
        run: |
          mkdir -p ci-artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/ottrin-app.exe ci-artifacts/ottrin-app.exe
            cp target/release/ottrin-priv-helper.exe ci-artifacts/ottrin-priv-helper.exe
          else
            cp target/release/ottrin-app ci-artifacts/ottrin-app
            cp target/release/ottrin-priv-helper ci-artifacts/ottrin-priv-helper
          fi

      - name: Upload release-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ottrin-release-${{ runner.os }}-${{ runner.arch }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows native boundary failure diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-boundary-failure
          path: windows-job-fixtures.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Retire production Linux HTML integration
        if: always() && runner.os == 'Linux'
        run: python3 scripts/ci/linux-html-sandbox.py cleanup

      - name: Upload Linux HTML sandbox evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-html-sandbox
          path: html-sandbox-evidence/
          if-no-files-found: ignore
          retention-days: 7

  search-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Release benchmark smoke test
        run: |
          mkdir -p ci-artifacts
          cargo test -p ottrin-search --release -- bench_query_500k --nocapture \
            | tee ci-artifacts/search-benchmark.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: ottrin-search-benchmark
          path: ci-artifacts/search-benchmark.txt
          if-no-files-found: error
          retention-days: 14
