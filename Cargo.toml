[workspace]
members = [
  "crates/ottrin-app",
  "crates/ottrin-core",
  "crates/ottrin-platform",
  "crates/ottrin-search",
  "crates/ottrin-preview",
  "crates/ottrin-ui",
]
resolver = "2"
default-members = ["crates/ottrin-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["hoozter <hello@hoozter.com>"]
repository = "https://github.com/hoozter/ottrin"
homepage = "https://hoozter.com"
description = "A fast, keyboard-friendly file manager built with Rust and egui."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
egui = "0.33"
# AccessKit's Unix AT-SPI event loop can abort a desktop session when its D-Bus
# endpoint disappears. Keep the supported window backends, but do not opt into
# that optional integration until it handles that failure safely upstream.
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "wgpu", "x11"] }
egui_extras = { version = "0.33", features = ["svg", "image"] }

[profile.dev]
opt-level = 1

# The platform/UI test crates are large. Optimizing them with full debug data
# exhausts LLVM memory on hosted Windows runners. Assertions stay enabled;
# release benchmarks and shipped binaries keep their separate release profile.
[profile.test.package.ottrin-platform]
opt-level = 0
debug = 0

[profile.test.package.ottrin-ui]
opt-level = 0
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

# Keep Windows Shift+Delete distinguishable from Ctrl+X without changing text Cut.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
