[package]
name = "ottrin-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ottrin-core = { path = "../ottrin-core" }
ottrin-preview = { path = "../ottrin-preview" }
ottrin-platform = { path = "../ottrin-platform" }
ottrin-search = { path = "../ottrin-search" }
egui.workspace = true
eframe.workspace = true
egui_extras = { workspace = true, features = ["syntect"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
sha2 = "0.10"
same-file = "1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }
