[package]
name = "ottrin-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ottrin-core = { path = "../ottrin-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror.workspace = true
tracing.workspace = true
trash = "5"
opener = "0.8"
serde.workspace = true
serde_json = "1"
getrandom = "0.3"
same-file = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"
rustix = { version = "0.38", features = ["fs", "process"] }
gio = "0.20.12"
libc = "0.2"
percent-encoding = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_NetworkManagement_WNet", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }
