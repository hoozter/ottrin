[package]
name = "ottrin-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
system-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
windows-office = []

[[bin]]
name = "ottrin-office-render"
path = "src/bin/ottrin-office-render.rs"
required-features = ["windows-office"]

[[bin]]
name = "ottrin-media-playback"
path = "src/bin/ottrin-media-playback.rs"
required-features = ["system-gstreamer"]

[dependencies]
ottrin-core = { path = "../ottrin-core" }
thiserror.workspace = true
serde.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
lofty = { version = "0.22", default-features = false }
lopdf = "0.34"
resvg = "0.45"
usvg = { version = "0.45", default-features = false }
tar = "0.4"
flate2 = "1"
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ab_glyph = "0.2"
# Direct metadata API; ttf-parser 0.25.1 is MIT OR Apache-2.0 and already
# resolved transitively by the existing preview rendering stack.
ttf-parser = "0.25.1"
# The workspace already pins this bundled SQLite stack through ottrin-search.
# `serialize` exposes the owned-memory deserialize API used for immutable
# preview snapshots; `hooks` and `limits` provide the query work boundaries.
rusqlite = { version = "0.31", features = ["bundled", "serialize", "hooks", "limits"] }
sha2 = "0.10"
crc32fast = "1"
base64 = "0.22"
libc = "0.2"
rwml = { version = "=0.1.4", default-features = false, features = ["render"] }

# `stl_io` 0.11.x (MIT; https://github.com/hmeyer/stl_io) is a pure-Rust
# streaming parser. Preview-specific input, triangle, and raster bounds remain local.
stl_io = "0.11"
# Bounded OBJ previews use only the in-memory buffer API.  Default `ahash`
# acceleration is unnecessary for this small, preflight-bounded surface.
tobj = { version = "=4.0.5", default-features = false }
epaint_default_fonts = "0.33"
pdfium-render = { version = "=0.9.3", default-features = false, features = ["image_latest", "pdfium_latest", "thread_safe"] }

[target.'cfg(target_os = "linux")'.dependencies]
lol_html = "3.0.1"
gstreamer = { version = "=0.24.4", optional = true }
gstreamer-app = { version = "=0.24.4", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Storage_FileSystem", "Win32_System_Com"] }
windows-core = "0.58"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
