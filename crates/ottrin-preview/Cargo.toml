[package]
name = "ottrin-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ottrin-core = { path = "../ottrin-core" }
thiserror.workspace = true
serde.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
lofty = { version = "0.22", default-features = false }
lopdf = "0.34"
resvg = "0.45"
usvg = { version = "0.45", default-features = false }
tar = "0.4"
flate2 = "1"
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ab_glyph = "0.2"
# Direct metadata API; ttf-parser 0.25.1 is MIT OR Apache-2.0 and already
# resolved transitively by the existing preview rendering stack.
ttf-parser = "0.25.1"
# The workspace already pins this bundled SQLite stack through ottrin-search.
# `serialize` exposes the owned-memory deserialize API used for immutable
# preview snapshots; `hooks` and `limits` provide the query work boundaries.
rusqlite = { version = "0.31", features = ["bundled", "serialize", "hooks", "limits"] }
sha2 = "0.10"
libc = "0.2"
# `stl_io` 0.11.x (MIT; https://github.com/hmeyer/stl_io) is a pure-Rust
# streaming parser. Preview-specific input, triangle, and raster bounds remain local.
stl_io = "0.11"
# Bounded OBJ previews use only the in-memory buffer API.  Default `ahash`
# acceleration is unnecessary for this small, preflight-bounded surface.
tobj = { version = "=4.0.5", default-features = false }
epaint_default_fonts = "0.33"
pdfium-render = { version = "=0.9.3", default-features = false, features = ["image_latest", "pdfium_latest", "thread_safe"] }
