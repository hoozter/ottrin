[package]
name = "ottrin-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ottrin-core = { path = "../ottrin-core" }
thiserror.workspace = true
serde.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
lofty = { version = "0.22", default-features = false }
lopdf = "0.34"
resvg = "0.45"
usvg = { version = "0.45", default-features = false }
tar = "0.4"
flate2 = "1"
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6.1"
ab_glyph = "0.2"
epaint_default_fonts = "0.33"
pdfium-render = { version = "=0.9.3", default-features = false, features = ["image_latest", "pdfium_latest", "thread_safe"] }
