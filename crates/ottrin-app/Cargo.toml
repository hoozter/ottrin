[package]
name = "ottrin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ottrin-core = { path = "../ottrin-core" }
ottrin-search = { path = "../ottrin-search" }
ottrin-ui = { path = "../ottrin-ui" }
ottrin-platform = { path = "../ottrin-platform" }
