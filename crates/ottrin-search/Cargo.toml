[package]
name = "ottrin-search"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ottrin-core = { path = "../ottrin-core" }
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "release_memory"] }
regex = "1"
notify = "8"
globset = "0.4"
walkdir = "2"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"
